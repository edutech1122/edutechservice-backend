services:
  - type: web
    name: edutechservice-photo-signature-api
    # Switched from runtime: python to runtime: docker so the build can
    # install the `tesseract` OCR engine as a system package -- needed by
    # the new MSBTE gazette OCR fallback (see backend/Dockerfile and
    # app/tools/msbte_result/ocr_fallback.py). Everything else (env vars,
    # plan, free-tier disk caveat below) is unchanged from the plain-python
    # deploy this replaces.
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_USERNAME
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://edutechservice.in,https://www.edutechservice.in,https://edutechservice-website.edutechservices1122.workers.dev"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

# NOTE: this free-tier config stores uploaded files and the jobs database on
# local disk inside the running instance, which Render wipes on every
# redeploy/restart (see backend/README.md's "Assumptions and placeholders").
# That's acceptable to get the tool live and working, since customers
# download their ZIP right after paying rather than relying on long-term
# storage -- but job history and any not-yet-downloaded files will be lost
# on a restart. Before relying on this for real volume, upgrade to a paid
# Render instance type and add a persistent disk (a few extra lines here),
# or move storage to S3-compatible object storage and the database to
# Postgres, per the platform analysis doc.

